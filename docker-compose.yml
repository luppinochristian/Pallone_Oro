# Le credenziali NON sono nel file: vanno nel file .env (vedi .env.example).
# Se una variabile obbligatoria manca, docker compose si ferma con un errore chiaro.
services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Imposta MYSQL_ROOT_PASSWORD nel file .env}
      MYSQL_DATABASE: ${MYSQL_DB:-golden_striker}
      MYSQL_USER: ${MYSQL_USER:?Imposta MYSQL_USER nel file .env}
      MYSQL_PASSWORD: ${MYSQL_PASS:?Imposta MYSQL_PASS nel file .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # $$ evita che la variabile venga espansa dall'host: la legge dal container
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-golden_striker}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASS: ${MYSQL_PASS}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
